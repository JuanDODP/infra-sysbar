[defaults]
inventory = inventory.ini
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
forks = 10

[ssh_connection]
pipelining = True
# Mantiene viva la conexión SSH aunque el servidor esté ocupado (docker build en t3.micro)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=20
