---
# Despliegue de una NUEVA VERSIÓN de la API en las instancias que estén corriendo.
#
# Las instancias del Auto Scaling Group se configuran y despliegan SOLAS al arrancar
# (templates/user_data.sh.tftpl). Este playbook solo hace falta cuando subes cambios
# a la rama configurada (app_repo_version) o cambias el .env (app_extra_env + terraform apply).
#
# Ejecuta en cada instancia, una por una (rolling), el mismo script del bootstrap:
#   /usr/local/bin/app-deploy  ->  git pull + .env desde SSM + docker compose up --build
#
# Uso:                 ansible-playbook deploy.yml
# Un solo servidor:    ansible-playbook deploy.yml --limit i-0123456789abcdef0
# Ver instancias:      ./inventory.py --list

# ==========================================================
# PLAY 0: Comprobar que hay instancias en el Auto Scaling Group
# ==========================================================
- name: Comprobar inventario dinámico
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Debe haber al menos una instancia corriendo
      assert:
        that: groups['webservers'] | default([]) | length > 0
        fail_msg: >-
          No hay instancias en el grupo webservers. Revisa que `terraform apply` haya terminado,
          que tu sesión de AWS esté activa (aws sso login --profile PERFIL) y prueba ./inventory.py --list
        success_msg: "Instancias encontradas: {{ groups['webservers'] | join(', ') }}"

# ==========================================================
# PLAY 1: Desplegar (rolling, una instancia a la vez)
# ==========================================================
- name: Desplegar la API en las instancias del Auto Scaling Group
  hosts: webservers
  become: true
  gather_facts: false
  serial: "{{ deploy_serial | default(1) }}"

  tasks:
    # Una instancia recién creada puede seguir ejecutando su bootstrap
    - name: Esperar a que termine el bootstrap (cloud-init)
      command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Verificar que el bootstrap dejó instalado app-deploy
      stat:
        path: /usr/local/bin/app-deploy
      register: deploy_script

    - name: Fallar con un mensaje claro si el bootstrap no terminó bien
      fail:
        msg: "El bootstrap falló en {{ inventory_hostname }}. Revisa: sudo tail -100 /var/log/sysbar-bootstrap.log"
      when: not deploy_script.stat.exists

    # async/poll: el build corre en segundo plano y Ansible lo revisa cada 15 s
    - name: Ejecutar app-deploy (git pull + .env + docker compose up --build)
      command: /usr/local/bin/app-deploy
      async: 1800
      poll: 15
      register: deploy_out

    - name: Resultado del despliegue
      debug:
        msg: "{{ deploy_out.stdout_lines | default([]) | last | default('ok') }}"

    - name: Esperar a que la API escuche en el puerto {{ app_port }}
      wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        timeout: 300

    - name: Verificar Nginx -> API (igual que el health check del ALB)
      uri:
        url: "http://127.0.0.1{{ health_check_path }}"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 24
      delay: 5

# ==========================================================
# PLAY 2: Comprobación final a través del dominio público
# ==========================================================
- name: Verificar el sitio público
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Probar https://{{ domain_name }}{{ health_check_path }}
      uri:
        url: "https://{{ domain_name }}{{ health_check_path }}"
        status_code: 200
        validate_certs: true
      register: public_check
      until: public_check.status == 200
      retries: 10
      delay: 15

    - name: Resultado
      debug:
        msg: "https://{{ domain_name }} respondió {{ public_check.status }} a través de NLB -> ALB -> ASG"
